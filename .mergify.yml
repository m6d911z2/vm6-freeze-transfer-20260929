queue_rules:
  - name: vm6-old-queue
    queue_conditions:
      - title = VM6_QUEUE_RULE_REVOKE_261005
    merge_conditions:
      - label = VM6_QUEUEFRESH_NEVER_261005
    merge_method: merge
  - name: vm6-railsstructure-261010
    batch_size: 2
    batch_max_wait_time: 30s
    queue_conditions:
      - base = vm6-railsstructure-base-261010
      - title ~= ^VM6_RAILSSTRUCT_(A|B)_261010$
    merge_conditions:
      - check-success = vm6-railsstructure-never-261010
    merge_method: merge-batch
    max_checks_retries: 0
merge_queue:
  max_parallel_checks: 1
  queue_controls_comment: false

pull_request_rules:
  - name: VM6 isolated Rails structure batch autoqueue 261010
    conditions:
      - base = vm6-railsstructure-base-261010
      - title ~= ^VM6_RAILSSTRUCT_(A|B)_261010$
    actions:
      queue: {}

conflict_resolvers:
  - paths:
      - db/structure.sql
    strategy: rails-structure
