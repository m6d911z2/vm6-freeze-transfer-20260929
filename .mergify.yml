queue_rules:
  - name: vm6-old-queue
    queue_conditions:
      - title = VM6_QUEUE_RULE_REVOKE_261005
    merge_conditions:
      - label = VM6_QUEUEFRESH_NEVER_261005
    merge_method: merge
  - name: vm6-autoctx-261010
    batch_size: 2
    batch_max_wait_time: 30s
    max_checks_retries: 0
    queue_conditions:
      - base = vm6-autoctx-base-261010
      - title ~= ^VM6_AUTOCTX_(READ|PEER)_261010$
    merge_conditions:
      - check-success = vm6-autoctx-never-261010
    merge_method: merge-batch
merge_queue:
  max_parallel_checks: 1
  queue_controls_comment: false


pull_request_rules:
  - name: VM6 automatic fork-provenance test only
    conditions:
      - base = vm6-autoctx-base-261010
      - title ~= ^VM6_AUTOCTX_(READ|PEER)_261010$
    actions:
      queue: {}
